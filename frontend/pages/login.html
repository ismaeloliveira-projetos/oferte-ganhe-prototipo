<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Oferte e Ganhe</title>

    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="login-page">
    <main class="login-container">
      <!-- Coluna da esquerda: identidade visual -->
      <div class="login-brand">
        <img src="../assets/logo.png" alt="Logo Oferte e Ganhe" />
        <h1>Oferte e Ganhe</h1>
        <p>Sistema de controle e gestão de talões</p>
      </div>

      <!-- Coluna da direita: formulário -->
      <div class="login-form-wrapper">
        <section class="login-card">
          <h2>Acessar sistema</h2>

          <form id="loginForm">
            <div class="form-group">
              <label for="email">E-mail</label>
              <input
                type="email"
                class="form-input"
                id="email"
                placeholder="Digite seu e-mail"
                required
              />
            </div>

            <div class="form-group">
              <label for="senha">Senha</label>
              <input
                type="password"
                class="form-input"
                id="senha"
                placeholder="Digite sua senha"
                required
              />
            </div>

            <button type="button" id="btnEsqueciSenha" class="link">
              Esqueceu a senha?
            </button>

            <!-- OVERLAY -->
            <div class="overlay" id="overlay"></div>

            <!-- MODAL -->
            <div class="modal" id="modal">
              <h3>Recuperar senha</h3>

              <p>Digite seu email para receber o token</p>

              <input type="email" id="emailRecuperar" placeholder="Seu email" />

              <div class="msg error hidden" id="msgError"></div>
              <div class="msg success hidden" id="msgSuccess"></div>

              <button type="button" id="btnRecuperar">Enviar</button>
            </div>

            <div id="loginError" class="alert-error hidden">
              Erro ao fazer login. Verifique seu e-mail e senha.
            </div>

            <button type="submit" class="btn-primary full-width" id="btnEntrar">
              <span id="btnText">Entrar</span>
              <span id="btnLoading" class="hidden">⏳ Carregando...</span>
            </button>

            <!-- MODAL RESET DE SENHA -->
            <div class="modal" id="modalReset">
              <h3>Redefinir senha</h3>
              <p>Digite o token recebido e sua nova senha</p>

              <input
                type="text"
                id="tokenDigitado"
                placeholder="Digite o token"
                maxlength="6"
              />
              <input type="password" id="novaSenha" placeholder="Nova senha" />
              <input
                type="password"
                id="confirmarSenha"
                placeholder="Confirmar nova senha"
              />

              <div class="msg error hidden" id="msgErrorReset"></div>
              <div class="msg success hidden" id="msgSuccessReset"></div>

              <button type="button" id="btnConfirmarReset">Confirmar</button>
            </div>
          </form>
        </section>
      </div>
    </main>

    <script src="../js/auth.js"></script>
  </body>
</html>
