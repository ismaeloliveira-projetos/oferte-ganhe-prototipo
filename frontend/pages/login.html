<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | TalãoFlow</title>

    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body class="login-page">
    <main class="login-container">
      <!-- Coluna da esquerda: identidade visual -->
      <div class="login-brand">
        <div class="brand-mark" aria-hidden="true">TF</div>
        <h1>TalãoFlow</h1>
        <p>Sistema de controle e gestão de talões</p>
      </div>

      <!-- Coluna da direita: formulário -->
      <div class="login-form-wrapper">
        <section class="login-card">
          <h2>Acessar sistema</h2>

          <form id="loginForm">
            <div class="form-group">
              <label for="email">E-mail</label>
              <input
                type="email"
                class="form-input"
                id="email"
                placeholder="Digite seu e-mail"
                required
              />
            </div>

            <div class="form-group">
              <label for="senha">Senha</label>
              <input
                type="password"
                class="form-input"
                id="senha"
                placeholder="Digite sua senha"
                required
              />
            </div>

            <div class="auth-links">
              <a href="esqueci-senha.html">Esqueceu a senha?</a>
            </div>

            <div id="loginError" class="alert-error hidden">
              Erro ao fazer login. Verifique seu e-mail e senha.
            </div>

            <button type="submit" class="btn-primary full-width" id="btnEntrar">
              <span id="btnText">Entrar</span>
              <span id="btnLoading" class="hidden">⏳ Carregando...</span>
            </button>
          </form>
        </section>
      </div>
    </main>

    <script src="../js/auth.js"></script>
  </body>
</html>
