<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Redefinir senha | Oferte e Ganhe</title>

    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body class="login-page">
    <main class="login-container">
      <div class="login-brand">
        <img src="../assets/logo.png" alt="Logo Oferte e Ganhe" />
        <h1>Oferte e Ganhe</h1>
        <p>Sistema de controle e gestão de talões</p>
      </div>

      <div class="login-form-wrapper">
        <section class="login-card">
          <h2>Redefinir senha</h2>

          <p>Crie uma nova senha para acessar sua conta.</p>

          <form id="formRedefinirSenha">
            <div class="form-group">
              <label for="novaSenha">Nova senha</label>
              <input
                type="password"
                class="form-input"
                id="novaSenha"
                placeholder="Digite a nova senha"
                required
              />
            </div>

            <div class="form-group">
              <label for="confirmarSenha">Confirmar nova senha</label>
              <input
                type="password"
                class="form-input"
                id="confirmarSenha"
                placeholder="Confirme a nova senha"
                required
              />
            </div>

            <div id="mensagemRedefinicao" class="alert-error hidden"></div>

            <button
              type="submit"
              class="btn-primary full-width"
              id="btnRedefinirSenha"
            >
              Redefinir senha
            </button>
          </form>

          <div class="auth-links">
            <a href="login.html">Voltar para o login</a>
          </div>
        </section>
      </div>
    </main>

    <script src="../js/redefinir-senha.js"></script>
  </body>
</html>
